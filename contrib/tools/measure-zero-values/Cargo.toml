[package]
name = "measure-zero-values"
version = "0.1.0"
edition = "2021"

# This is a standalone analysis tool - not part of the main workspace
# Build with: cargo build --release -p measure-zero-values
# Or from this directory: cargo build --release

[dependencies]
stackslib = { package = "stackslib", path = "../../../stackslib", default-features = false }
stacks-common = { package = "stacks-common", path = "../../../stacks-common", default-features = false }
rusqlite = { version = "0.31.0", features = ["blob", "bundled"] }
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.10"
